[package]
name = "crm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
deadpool-postgres = "0.14.2"
futures-util = "0.3.34"
hex = "0.4.3"
include_dir = "0.7.4"
krilla = "0.8.2"
rand = "0.10.3"
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres", "serde-float", "serde-arbitrary-precision"] }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ttf-parser = "0.25.1"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "decimal_float", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }

[dev-dependencies]
calamine = "0.38.0"
libc = "0.2.191"
pdf-extract = "0.12.1"
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", features = ["json", "cookies", "multipart"] }
testcontainers = { version = "0.28.0", features = ["blocking"] }

[profile.release]
codegen-units = 4
